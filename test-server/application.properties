# Конфиг тестового сервера (локальный запуск фиче-ветки allure-results-native).
# Данные изолированы в test-server/ и не пересекаются с ./data прод-конфига.
server.port=8080
spring.datasource.url=jdbc:h2:file:./test-server/data/reportdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
report.allure-results.storage-dir=./test-server/data/allure
report.backup.directory=./test-server/backups
report.backup.enabled=true
# Нативный режим: интеграция с Allure TestOps отключена (токен не нужен)
report.allure.enabled=false
